version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-relay-hub-admin-2026}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
